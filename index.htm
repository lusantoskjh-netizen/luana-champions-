<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champions Car - Portal de Pré-Aprovação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0c10 !important; color: #f3f4f6 !important; }
        .gold-grad { background: linear-gradient(135deg, #FFC700 0%, #D4A000 100%); }
        .card-bg { background-color: #15171d !important; border: 1px solid #232730 !important; }
        .input-bg { background-color: #0f1115 !important; border: 1px solid #1f232c !important; color: #fff !important; }
        .executive-shadow { box-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body class="min-h-screen pb-12 bg-[#0b0c10] text-gray-100">
    <!-- CABEÇALHO -->
    <header class="bg-[#111318] border-b border-[#232730] py-4 px-4 sticky top-0 z-40 executive-shadow">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xs font-extrabold tracking-widest text-white flex items-center gap-2 uppercase">
                    CHAMPIONS CAR <span class="text-[9px] bg-[#FFC700] text-black px-2 py-0.5 rounded-md font-black">TAQUARA - RJ</span>
                </h1>
                <p class="text-[10px] text-gray-400 font-medium flex items-center gap-1 mt-0.5">
                    📍 Estrada do Tindiba, 1457 • Pré-Aprovação Comercial
                </p>
            </div>
            <button onclick="abrirGerencia()" class="px-3 py-1.5 bg-[#232730] text-gray-200 rounded-lg text-xs font-bold hover:bg-[#2c313d] transition">Painel Executivo</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">
        <!-- SIMULADOR COMERCIAL RÁPIDO E ATRAENTE -->
        <div class="card-bg rounded-2xl p-6 shadow-2xl mb-5 border-2 border-[#FFC700]/30 executive-shadow">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-[#232730]">
                <div>
                    <h3 class="text-sm font-black text-white uppercase tracking-wide">Simulador & Pré-Aprovação Express</h3>
                    <p class="text-[11px] text-[#FFC700] font-semibold">Taxa Ativa: 1,6% a.m. | Geração instantânea de parcelas</p>
                </div>
                <span class="text-[10px] bg-[#FFC700] text-black font-extrabold px-2.5 py-1 rounded-md">Foco Vendas</span>
            </div>

            <div class="mb-3.5">
                <label class="block text-[11px] font-semibold text-gray-300 mb-1">Consultor Responsável:</label>
                <select id="consultor" class="w-full input-bg rounded-xl p-3 text-xs font-medium focus:ring-1 focus:ring-[#FFC700] outline-none">
                    <option value="Verdini">Verdini</option>
                    <option value="Simone">Simone</option>
                    <option value="Maria">Maria</option>
                    <option value="Rafael">Rafael</option>
                    <option value="Gisele">Gisele</option>
                    <option value="Gabriel">Gabriel</option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mb-3.5">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">Nome Completo do Cliente:</label>
                    <input type="text" id="nomeCliente" placeholder="Ex: Roberto Carlos" class="w-full input-bg rounded-xl p-3 text-xs outline-none focus:ring-1 focus:ring-[#FFC700]">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">WhatsApp de Contato:</label>
                    <input type="text" id="whatsappCliente" placeholder="(21) 99999-9999" class="w-full input-bg rounded-xl p-3 text-xs outline-none focus:ring-1 focus:ring-[#FFC700]">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5 mb-4">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">Veículo Desejado:</label>
                    <input type="text" id="veiculo" placeholder="Ex: Compass, Corolla..." class="w-full input-bg rounded-xl p-3 text-xs outline-none focus:ring-1 focus:ring-[#FFC700]">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">Valor do Veículo (R$):</label>
                    <input type="number" id="valorCarro" placeholder="60000" class="w-full input-bg rounded-xl p-3 text-xs outline-none focus:ring-1 focus:ring-[#FFC700]">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-300 mb-1">Valor de Entrada (R$):</label>
                    <input type="number" id="valorEntrada" placeholder="15000" class="w-full input-bg rounded-xl p-3 text-xs outline-none focus:ring-1 focus:ring-[#FFC700]">
                </div>
            </div>

            <button onclick="calcularSimulacao()" class="w-full gold-grad text-black font-black py-4 rounded-xl text-xs uppercase tracking-wider shadow-lg hover:opacity-95 transition">
                🚀 Calcular Simulação e Gerar Proposta
            </button>
        </div>

        <!-- DEMONSTRATIVO DE PARCELAS ATRAENTE -->
        <div id="resultadoSimulacao" class="hidden card-bg rounded-2xl p-5 border-2 border-[#FFC700] mb-5 executive-shadow animate-pulse">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#232730]">
                <h4 class="text-xs font-extrabold text-[#FFC700] uppercase">Simulação Pronta para Envio</h4>
                <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800/50 px-2.5 py-0.5 rounded font-bold">Taxa 1,6% a.m.</span>
            </div>
            
            <div id="tabelaParcelas" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4"></div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="enviarPropostaCliente()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-xs transition shadow flex items-center justify-center gap-2">
                    💬 Enviar Proposta WhatsApp
                </button>
                <button onclick="encaminharMesa()" class="flex-1 gold-grad text-black font-extrabold py-3.5 rounded-xl text-xs uppercase shadow-md transition opacity-50 cursor-not-allowed" id="btnMesa" disabled>
                    🏢 Encaminhar para a Mesa da Gerência
                </button>
            </div>
        </div>
    </main>

    <!-- PAINEL EXECUTIVO -->
    <div id="modalGerencia" class="hidden fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#15171d] border border-[#2c313d] rounded-2xl max-w-xl w-full p-6 max-h-[90vh] overflow-y-auto executive-shadow">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-[#232730]">
                <h3 class="text-xs font-black text-white uppercase tracking-wider">Acesso Restrito - Gerência</h3>
                <button onclick="fecharGerencia()" class="text-gray-400 hover:text-white font-bold text-sm bg-[#232730] px-2.5 py-1 rounded-lg">X</button>
            </div>
            <div id="loginArea">
                <input type="password" id="senhaGerencia" placeholder="Digite a senha de gerência" class="w-full input-bg rounded-xl p-3 text-xs mb-3.5 outline-none focus:ring-1 focus:ring-[#FFC700]">
                <button onclick="validarSenha()" class="w-full gold-grad text-black font-extrabold py-3 rounded-xl text-xs uppercase">Entrar no Painel</button>
            </div>
            <div id="painelGerencia" class="hidden text-center">
                <p class="text-xs text-emerald-400 font-bold mb-3">Painel de Mesa Autorizado com Sucesso!</p>
                <div id="listaLeadsGerencia" class="space-y-2 text-xs text-left max-h-60 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        let leadsSalvos = JSON.parse(localStorage.getItem('champions_leads')) || [];
        let propostaEnviadaWhatsApp = false;

        function calcularSimulacao() {
            const nome = document.getElementById('nomeCliente').value;
            const veiculo = document.getElementById('veiculo').value;
            const valorCarro = parseFloat(document.getElementById('valorCarro').value) || 0;
            const valorEntrada = parseFloat(document.getElementById('valorEntrada').value) || 0;

            if(!nome || !veiculo || valorCarro <= 0) { 
                alert('Preencha o nome do cliente, o veículo e o valor do carro.'); 
                return; 
            }

            const valorFinanciado = valorCarro - valorEntrada;
            const taxa = 0.016;
            const prazos = [24, 36, 48, 60];
            let html = '';

            prazos.forEach(meses => {
                const parcela = (valorFinanciado * taxa * Math.pow(1 + taxa, meses)) / (Math.pow(1 + taxa, meses) - 1);
                html += `<div class="bg-[#0f1115] p-3 rounded-xl border border-[#FFC700]/30 text-center"><span class="text-[10px] text-gray-400 block font-medium">${meses}x de</span><span class="text-xs font-extrabold text-[#FFC700]">R$ ${parcela.toFixed(2)}</span></div>`;
            });

            document.getElementById('tabelaParcelas').innerHTML = html;
            const resDiv = document.getElementById('resultadoSimulacao');
            resDiv.classList.remove('hidden');
            resDiv.classList.remove('animate-pulse');
            propostaEnviadaWhatsApp = false;
            
            const btnMesa = document.getElementById('btnMesa');
            btnMesa.classList.add('opacity-50', 'cursor-not-allowed');
            btnMesa.disabled = true;
        }

        function enviarPropostaCliente() {
            const nome = document.getElementById('nomeCliente').value;
            const veiculo = document.getElementById('veiculo').value;
            const consultor = document.getElementById('consultor').value;
            const whatsapp = document.getElementById('whatsappCliente').value.replace(/\D/g, '');
            
            const texto = encodeURIComponent(`Olá ${nome}! Aqui é o(a) ${consultor} da Champions Car (Estrada do Tindiba, Taquara). Sua simulação para o ${veiculo} está pronta com taxa especial de 1,6% a.m. Vamos fechar negócio?`);
            
            window.open(`https://api.whatsapp.com/send?phone=55${whatsapp}&text=${texto}`, '_blank');
            
            propostaEnviadaWhatsApp = true;
            const btnMesa = document.getElementById('btnMesa');
            btnMesa.classList.remove('opacity-50', 'cursor-not-allowed');
            btnMesa.disabled = false;
            alert('Proposta enviada! Botão de encaminhar para a mesa liberado.');
        }

        function encaminharMesa() {
            if(!propostaEnviadaWhatsApp) {
                alert('Envie a proposta ao cliente via WhatsApp primeiro.');
                return;
            }

            leadsSalvos.push({ 
                id: Date.now(), 
                consultor: document.getElementById('consultor').value, 
                nome: document.getElementById('nomeCliente').value, 
                veiculo: document.getElementById('veiculo').value, 
                status: 'Aguardando Mesa',
                data: new Date().toLocaleDateString()
            });
            
            localStorage.setItem('champions_leads', JSON.stringify(leadsSalvos));
            alert('Lead encaminhado com sucesso para a Mesa!');
            location.reload();
        }

        function abrirGerencia() { document.getElementById('modalGerencia').classList.remove('hidden'); }
        function fecharGerencia() { document.getElementById('modalGerencia').classList.add('hidden'); }
        
        function validarSenha() {
            if(document.getElementById('senhaGerencia').value === 'Luana1234566') {
                document.getElementById('loginArea').classList.add('hidden');
                document.getElementById('painelGerencia').classList.remove('hidden');
                let html = leadsSalvos.length === 0 ? '<p class="text-gray-400">Nenhum lead na mesa.</p>' : '';
                leadsSalvos.forEach(l => {
                    html += `<div class="bg-[#0f1115] p-2.5 rounded-lg border border-[#232730] mb-2"><b>${l.nome}</b> (${l.veiculo}) - Consultor: ${l.consultor}</div>`;
                });
                document.getElementById('listaLeadsGerencia').innerHTML = html;
            } else {
                alert('Senha incorreta!');
            }
        }
    </script>
</body>
</html>
